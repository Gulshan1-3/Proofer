services:
  proofer:
    build:
      context: .
      dockerfile: Dockerfile
    image: proofer:latest
    container_name: proofer-workstation
    restart: unless-stopped
    ports:
      - "${PORT:-8086}:8086"
    environment:
      - HOST=0.0.0.0
      - PORT=8086
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8086/"]
      interval: 30s
      timeout: 3s
      retries: 3
